services:
  - type: web
    name: uebank-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: uebank-db
          property: connectionString

databases:
  - name: uebank-db
    plan: free
    databaseName: uebank
